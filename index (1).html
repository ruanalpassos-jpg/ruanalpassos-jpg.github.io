<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Rebanho</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2a7d46">
<meta name="color-scheme" content="light">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f5f6f1;--sf:#fff;--ink:#1c2a20;--mut:#66726a;--ln:#d9ddd2;--vaca:#2f6b3f;--touro:#34506e;--tag:#f2c230;--tagink:#3a2f00;--bad:#a23b2a}
html{height:100%}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:6px 0 10px}
h2{font:700 17px/1.2 Georgia,serif;margin:18px 0 8px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
nav button{flex:1;padding:10px 4px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;font:600 14px system-ui,sans-serif}
nav button.on{background:var(--vaca);color:#fff;border-color:var(--vaca)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--vaca);color:#fff;font:600 15px system-ui,sans-serif;margin-top:12px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.tag{display:inline-block;background:var(--tag);color:var(--tagink);font-weight:700;padding:1px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.it:last-child{border:0}
.F{color:var(--vaca)}.M{color:var(--touro)}.mut{color:var(--mut);font-size:14px}
.tree,.tree ul{list-style:none;margin:0;padding-left:16px;border-left:2px solid var(--ln)}
.tree{padding-left:0;border:0}
.tree li{margin:6px 0}.tree .x{color:var(--mut);font-style:italic}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left;font-size:15px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.big{font:700 28px Georgia,serif}
.empty{color:var(--mut);padding:14px 0}
.anim{margin:6px 0 4px}.anim svg{width:100%;height:auto;max-height:250px;display:block}
.ln{fill:none;stroke:#e0b52a;stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:dw 1.2s ease forwards}.l2{animation-delay:.1s}@keyframes dw{to{stroke-dashoffset:0}}
.bp{fill:var(--touro);fill-opacity:.18;stroke:var(--touro);stroke-width:2}.bm{fill:var(--vaca);fill-opacity:.18;stroke:var(--vaca);stroke-width:2}
.bt{font:600 11px system-ui,sans-serif;fill:var(--ink)}.lb{font:12px system-ui,sans-serif;fill:var(--mut)}
.ft{font:700 12px system-ui,sans-serif;fill:#3a2f00;opacity:0;animation:fi .5s 1.6s forwards}@keyframes fi{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}.dr{display:none}.ft{animation:none;opacity:1}}

body{padding-bottom:96px}
.pf{position:relative;height:33.3vh;min-height:190px;border-radius:14px;margin:12px 0;overflow:hidden;background:var(--sf) center/cover no-repeat;border:1px solid var(--ln);display:flex;align-items:flex-end;cursor:pointer}
.pf.F{border-bottom:5px solid var(--vaca)}.pf.M{border-bottom:5px solid var(--touro)}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;opacity:.5}
.pi{position:relative;width:100%;padding:34px 14px 12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.pn{font:700 22px Georgia,serif}.ps{font-size:13px;opacity:.92}
.pt{display:inline-block;background:var(--tag);color:var(--tagink);font-weight:700;font-size:12px;padding:1px 8px;border-radius:6px;margin:4px 0}
.foto{width:100%;height:33.3vh;min-height:190px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block}
.fpre{height:170px;border-radius:12px;background:var(--bg);border:1px dashed var(--ln);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:60px;margin-bottom:10px}.fpre img{width:100%;height:100%;object-fit:cover}
.addbar{position:fixed;left:0;right:0;bottom:0;padding:24px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 45%);z-index:6;display:flex;justify-content:center;pointer-events:none}
.addbar .btn{width:100%;max-width:612px;margin:0;pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.25)}

:root{--bg:#ffffff;--sf:#ffffff;--ink:#16301f;--mut:#5b6b60;--ln:#cfe3d5;--vaca:#2a7d46;--touro:#14532d;--tag:#e3f3e7;--tagink:#14532d}
nav button{border-color:var(--ln)}
.card{border-color:var(--ln);box-shadow:0 1px 3px rgba(20,83,45,.08)}
label.fb{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin:0;padding:11px 14px;border-radius:10px;background:var(--vaca);color:#fff;font:600 15px system-ui,sans-serif}
label.fb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;font-size:0}

input[type=file]{padding:6px;font-size:13px;color:var(--mut)}
input[type=file]::file-selector-button{padding:9px 14px;margin-right:10px;border:0;border-radius:8px;background:var(--vaca);color:#fff;font:600 14px system-ui,sans-serif}
</style>
</head>
<body>
<h1>Meu Rebanho</h1>
<nav id="nav"></nav>
<main id="app"></main>
<script>
var pend=null,K='rebanho-v1',D={animais:[],leite:[]},tab='animais',sel=null,edit=null;
try{var s=localStorage.getItem(K);if(s)D=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){return false}}
var TL={vaca:'Vaca',boi:'Boi',bezerra:'Bezerra',bezerro:'Bezerro'},ICON={vaca:'🐄',boi:'🐂',bezerra:'🐮',bezerro:'🐮'},novo=false,fotoTmp=null;
var RACAS=['Sem raça definida (SRD)','Mestiço (cruzamento sem registro)','Girolando 1/2 (F1)','Girolando 3/8','Girolando 5/8','Girolando 3/4','Girolando 7/8','Girolando (grau não informado)','Gir Leiteiro','Gir','Holandesa (preta e branca)','Holandesa vermelha e branca','Jersey','Pardo-Suíço','Guzerá','Sindi','Nelore','Nelore Mocho','Tabapuã','Brahman','Indubrasil','Senepol','Angus (Preto)','Angus (Vermelho)','Hereford','Braford','Brangus','Santa Gertrudis','Simental','Simbrasil','Charolês','Limousin','Canchim','Caracu','Wagyu','Mocho Nacional','Pantaneiro','Curraleiro Pé-Duro','Crioulo Lageano','Junqueira','Franqueiro','Normando','Ayrshire','Guernsey','Shorthorn','Pitangueiras','Red Poll','Devon','Piemontês','Marchigiana','Chianina','Tarentaise','Belgian Blue','Bonsmara','Beefmaster','Droughtmaster','Parda Alpina','Montbéliarde','Fleckvieh','Kiwi Cross','Normanda','Búfalo Murrah','Búfalo Mediterrâneo','Outra (digite o nome)'];
function tp(a){return a.tipo||(a.sexo==='F'?'vaca':'boi')}
function racaOpts(){return RACAS.map(function(r){return '<option value="'+esc(r)+'">'}).join('')}
function tipoRaca(a){var t=TL[tp(a)];return a.raca?t+' · '+esc(a.raca):t}
function editar(b){edit=find(b);fotoTmp=null;sel=null;novo=false;pend=null;render();window.scrollTo(0,0)}
function prev(u){var e=document.getElementById('fpre');if(e)e.innerHTML=u?'<img src="'+u+'" alt="">':'<span>🐄</span>'}
function pegaFoto(i){var f=i.files&&i.files[0],m=document.getElementById('fmsg');if(!f)return;if(m)m.textContent='Carregando '+f.name+'...';
 var r=new FileReader();r.onerror=function(){if(m)m.textContent='Não consegui ler essa foto.'};
 r.onload=function(){i.value='';var im=new Image();im.onerror=function(){if(m)m.textContent='Não consegui abrir essa foto. Tente outra.'};
  im.onload=function(){var M=520,s=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);fotoTmp=c.toDataURL('image/jpeg',0.72);prev(fotoTmp);if(m)m.textContent='Foto pronta. Toque em Salvar animal.'};
  im.src=r.result};r.readAsDataURL(f)}
window.onerror=function(m){var e=document.getElementById('fmsg')||document.getElementById('err');if(e)e.textContent='Erro: '+m};
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function find(b){var k=String(b).trim().toLowerCase();return D.animais.filter(function(a){return a.b.toLowerCase()===k})[0]}
function hoje(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fdate(d){return d?d.split('-').reverse().join('/'):''}
function lbl(b){var a=find(b);return '<span class="tag">'+esc(b)+'</span>'}
function media(b){var r=D.leite.filter(function(x){return x.b===b});if(!r.length)return null;return r.reduce(function(s,x){return s+x.l},0)/r.length}
function fmt(n){return n==null?'–':n.toFixed(1).replace('.',',')+' L'}
function nav(){var t=[['animais','Animais'],['leite','Leite'],['backup','Backup']];
 document.getElementById('nav').innerHTML=t.map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function go(t){tab=t;sel=null;edit=null;novo=false;fotoTmp=null;pend=null;render()}
function ancs(b,d,role){var a=find(b),h='<li>'+(role?'<span class="mut">'+role+': </span>':'');
 if(!a){return h+'<span class="x">'+esc(b)+' (fora do cadastro)</span></li>'}
 h+='<span class="'+a.sexo+'">'+lbl(b)+'</span>';
 if(d>0&&(a.pai||a.mae)){h+='<ul>'+(a.pai?ancs(a.pai,d-1,'Pai'):'')+(a.mae?ancs(a.mae,d-1,'Mãe'):'')+'</ul>'}
 return h+'</li>'}
function desc(b,d,seen){var k=D.animais.filter(function(x){return String(x.mae).toLowerCase()===b.toLowerCase()||String(x.pai).toLowerCase()===b.toLowerCase()});if(!k.length||d<0)return '';
 return '<ul>'+k.map(function(x){var h='<li><span class="'+x.sexo+'">'+lbl(x.b)+'</span> <span class="mut">'+(x.sexo==='F'?'fêmea':'macho')+(x.nasc?' · '+fdate(x.nasc):'')+'</span>';
  if(d>0&&seen.indexOf(x.b)<0)h+=desc(x.b,d-1,seen.concat(b));return h+'</li>'}).join('')+'</ul>'}
function opts(sx){return D.animais.filter(function(a){return a.sexo===sx}).map(function(a){return '<option value="'+esc(a.b)+'">'+esc(a.nome||'')+'</option>'}).join('')}
function form(a){a=a||{b:'',tipo:'vaca',raca:'',nasc:'',mae:'',pai:'',obs:'',foto:''};var ed=!!edit,t=tp(a);
 var op=['vaca','boi','bezerra','bezerro'].map(function(x){return '<option value="'+x+'"'+(t===x?' selected':'')+'>'+TL[x]+'</option>'}).join('');
 return '<div class="card"><h2 style="margin-top:0">'+(ed?'Editar animal':'Novo animal')+'</h2>'+
 '<div class="fpre" id="fpre">'+(a.foto?'<img src="'+esc(a.foto)+'" alt="">':'<span>🐄</span>')+'</div>'+
 '<label>Foto (galeria ou câmera)</label><input type="file" accept="image/*" onchange="pegaFoto(this)">'+
 '<label>Tirar foto agora</label><input type="file" accept="image/*" capture="environment" onchange="pegaFoto(this)">'+
 '<div id="fmsg" class="mut" style="margin:6px 0"></div><button class="btn bad" style="margin:0 0 6px" onclick="fotoTmp=\'\';prev(\'\')">Remover foto</button>'+
 '<label>Nome do animal</label><input id="f_b" value="'+esc(a.b)+'" '+(ed?'readonly':'')+' autocomplete="off">'+
 '<div class="row"><div><label>Tipo</label><select id="f_tipo">'+op+'</select></div><div><label>Nascimento</label><input id="f_nasc" type="date" value="'+esc(a.nasc)+'"></div></div>'+
 '<label>Raça (digite para buscar na lista)</label><input id="f_raca" list="dl_r" value="'+esc(a.raca)+'" placeholder="Ex.: Girolando, Gir, Holandesa" autocomplete="off"><datalist id="dl_r">'+racaOpts()+'</datalist>'+
 '<label>Nome da mãe</label><input id="f_mae" list="dl_m" value="'+esc(a.mae)+'"><datalist id="dl_m">'+opts('F')+'</datalist>'+
 '<label>Nome do pai (touro ou sêmen)</label><input id="f_pai" list="dl_p" value="'+esc(a.pai)+'"><datalist id="dl_p">'+opts('M')+'</datalist>'+
 '<label>Observações</label><textarea id="f_obs" rows="2">'+esc(a.obs)+'</textarea>'+
 '<div id="err" class="mut" style="color:var(--bad)"></div>'+
 '<button class="btn" onclick="salvar()">Salvar animal</button> <button class="btn alt" onclick="edit=null;novo=false;fotoTmp=null;render()">Cancelar</button></div>'}
function salvar(){var v=function(i){return document.getElementById(i).value.trim()},b=v('f_b'),e=document.getElementById('err');
 if(!b){e.textContent='Informe o nome do animal.';return}
 var t=v('f_tipo'),a={b:b,nome:'',tipo:t,raca:v('f_raca'),sexo:(t==='vaca'||t==='bezerra')?'F':'M',nasc:v('f_nasc'),mae:v('f_mae'),pai:v('f_pai'),obs:v('f_obs'),foto:fotoTmp!==null?fotoTmp:(edit?(edit.foto||''):'')};
 if(a.mae.toLowerCase()===b.toLowerCase()||a.pai.toLowerCase()===b.toLowerCase()){e.textContent='O animal não pode ser pai ou mãe de si mesmo.';return}
 var old=JSON.stringify(D),i=D.animais.map(function(x){return x.b}).indexOf(b);
 if(edit){D.animais[i]=a}else{if(find(b)){e.textContent='Já existe um animal com o nome '+b+'.';return}D.animais.push(a)}
 if(!save()){D=JSON.parse(old);e.textContent='Sem espaço para salvar. Use uma foto menor ou faça backup.';return}
 sel=b;edit=null;novo=false;fotoTmp=null;render();window.scrollTo(0,0)}
function anim(b){var a=find(b);if(!a||!(a.pai||a.mae))return '';var nm=function(s){s=String(s||'');return s.length>11?s.slice(0,10)+'…':s},P=a.pai?nm(a.pai):'?',M=a.mae?nm(a.mae):'?',C=nm(b),A='M70 78 Q70 112 160 112 L160 132',B='M250 78 Q250 112 160 112 L160 132';
return `<div class="anim"><svg viewBox="0 0 320 200" role="img" aria-label="Pai e mãe se ligam e dão origem a ${esc(b)}"><defs><radialGradient id="gg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".55" stop-color="#f2c230"/><stop offset="1" stop-color="#b8860b"/></radialGradient></defs><path class="ln" pathLength="100" d="${A}"/><path class="ln l2" pathLength="100" d="${B}"/><circle class="bp" cx="70" cy="50" r="28"/><circle class="bm" cx="250" cy="50" r="28"/><text class="bt" x="70" y="54" text-anchor="middle">${esc(P)}</text><text class="bt" x="250" y="54" text-anchor="middle">${esc(M)}</text><circle cx="160" cy="160" r="0" fill="url(#gg)"><animate attributeName="r" values="0;30" dur=".6s" begin="1.2s" fill="freeze"/></circle><text class="ft" x="160" y="164" text-anchor="middle">${esc(C)}</text></svg></div>`}
function detalhe(b){var a=find(b);if(!a){sel=null;return render()}var m=media(b),t=tp(a);
 return '<div class="card"><button class="btn alt" style="margin:0 0 10px" onclick="pend=null;sel=null;render()">Voltar</button>'+
 (a.foto?'<img class="foto" src="'+esc(a.foto)+'" alt="">':'')+
 '<div class="big '+a.sexo+'">'+esc(a.b)+'</div><div class="mut">'+tipoRaca(a)+(a.nasc?' · nasceu em '+fdate(a.nasc):'')+'</div>'+
 (a.obs?'<p class="mut">'+esc(a.obs)+'</p>':'')+(a.sexo==='F'?'<p>Média de leite: <b>'+fmt(m)+'</b> por ordenha registrada</p>':'')+
 anim(b)+'<h2>Antepassados</h2>'+((a.pai||a.mae)?'<ul class="tree">'+ancs(b,3)+'</ul>':'<div class="empty">Pai e mãe não informados.</div>')+
 '<h2>Descendentes</h2>'+(desc(b,3,[])?'<div class="tree">'+desc(b,3,[])+'</div>':'<div class="empty">Nenhum filho cadastrado.</div>')+
 '<button class="btn" data-b="'+esc(b)+'" onclick="editar(this.getAttribute(\'data-b\'))">Editar</button> '+
 '<button class="btn bad" data-b="'+esc(b)+'" onclick="apagar(this.getAttribute(\'data-b\'))">'+(pend===b?'Toque de novo para confirmar':'Excluir')+'</button></div>'}
function apagar(b){if(pend!==b){pend=b;render();return}pend=null;
 D.animais=D.animais.filter(function(a){return a.b!==b});D.leite=D.leite.filter(function(x){return x.b!==b});save();sel=null;render()}
function pAnimais(){if(edit||novo)return form(edit);if(sel)return detalhe(sel);
 return '<h2 style="margin-top:6px">Rebanho ('+D.animais.length+')</h2><input placeholder="Buscar nome ou raça" value="'+esc(window._q||'')+'" oninput="window._q=this.value;lista()"><div id="lista"></div><div class="addbar"><button class="btn" onclick="novo=true;fotoTmp=null;render();window.scrollTo(0,0)">+ Adicionar animal</button></div>'}
function lista(){var q=(window._q||'').toLowerCase(),el=document.getElementById('lista');if(!el)return;
 var l=D.animais.filter(function(a){return !q||a.b.toLowerCase().indexOf(q)>=0||String(a.raca||'').toLowerCase().indexOf(q)>=0});
 el.innerHTML=l.length?l.map(function(a){var t=tp(a);return '<div class="pf '+a.sexo+'" data-b="'+esc(a.b)+'"'+(a.foto?' style="background-image:url('+esc(a.foto)+')"':'')+'>'+(a.foto?'':'<span class="ph">'+ICON[t]+'</span>')+'<div class="pi"><div class="pn">'+esc(a.b)+'</div><div class="pt">'+tipoRaca(a)+'</div><div class="ps">'+(a.mae?'Mãe: '+esc(a.mae):'')+(a.mae&&a.pai?' · ':'')+(a.pai?'Pai: '+esc(a.pai):'')+'</div></div></div>'}).join(''):'<div class="empty">Nenhum animal ainda. Toque em + Adicionar animal, logo abaixo.</div>';
 Array.prototype.forEach.call(el.querySelectorAll('.pf'),function(n){n.onclick=function(){sel=n.getAttribute('data-b');pend=null;render();window.scrollTo(0,0)}})}
function pLeite(){var vacas=D.animais.filter(function(a){return a.sexo==='F'});
 var h='<div class="card"><h2 style="margin-top:0">Registrar ordenha</h2>'+
 '<label>Vaca</label><input id="l_b" list="dl_v" autocomplete="off"><datalist id="dl_v">'+opts('F')+'</datalist>'+
 '<div class="row"><div><label>Data</label><input id="l_d" type="date" value="'+hoje()+'"></div><div><label>Litros</label><input id="l_l" type="number" inputmode="decimal" step="0.1" min="0"></div></div>'+
 '<div id="lerr" class="mut" style="color:var(--bad)"></div><button class="btn" onclick="addLeite()">Salvar litros</button></div>';
 var soma=function(l){return l.reduce(function(s,x){return s+x.l},0)},
 rows=vacas.map(function(a){var l=D.leite.filter(function(x){return x.b===a.b});return {a:a,n:l.length,t:soma(l),m:l.length?soma(l)/l.length:null}}).filter(function(r){return r.n}).sort(function(x,y){return y.m-x.m}),
 tot=soma(D.leite),hj=soma(D.leite.filter(function(x){return x.d===hoje()}));
 h+='<h2>Total</h2><div class="card"><div class="big F">'+fmt(tot)+'</div><p style="margin:6px 0 0">Total de leite registrado: <b>'+fmt(tot)+'</b>, em '+D.leite.length+(D.leite.length===1?' ordenha':' ordenhas')+' de '+rows.length+(rows.length===1?' vaca.':' vacas.')+'</p><p class="mut" style="margin:4px 0 0">Hoje: '+fmt(hj)+'</p></div>';
 h+='<h2>Por vaca</h2><div class="card sc">'+(rows.length?'<table><tr><th>Vaca</th><th class="n">Total</th><th class="n">Média</th></tr>'+rows.map(function(r){return '<tr><td>'+lbl(r.a.b)+'</td><td class="n">'+fmt(r.t)+'</td><td class="n">'+fmt(r.m)+'</td></tr>'}).join('')+'<tr><td><b>Rebanho</b></td><td class="n"><b>'+fmt(tot)+'</b></td><td class="n"><b>'+fmt(D.leite.length?tot/D.leite.length:null)+'</b></td></tr></table><p class="mut" style="margin:8px 0 0">Média = litros por ordenha registrada.</p>':'<div class="empty">Sem registros de leite. Salve a primeira ordenha acima.</div>')+'</div>';
 var rec=D.leite.slice().reverse().slice(0,15);
 h+='<h2>Últimos registros</h2><div class="card">'+(rec.length?rec.map(function(x){var i=D.leite.indexOf(x);return '<div class="it" style="cursor:default"><div>'+lbl(x.b)+' <span class="mut">'+fdate(x.d)+'</span></div><div>'+fmt(x.l)+' <button class="btn bad" style="margin:0 0 0 8px;padding:4px 10px" onclick="delLeite('+i+')">Apagar</button></div></div>'}).join(''):'<div class="empty">Nada por aqui ainda.</div>')+'</div>';return h}
function addLeite(){var b=document.getElementById('l_b').value.trim(),d=document.getElementById('l_d').value,l=parseFloat(String(document.getElementById('l_l').value).replace(',','.')),e=document.getElementById('lerr');
 var a=find(b);if(!a||a.sexo!=='F'){e.textContent='Escolha uma vaca já cadastrada.';return}
 if(isNaN(l)||l<0){e.textContent='Informe os litros.';return}D.leite.push({b:a.b,d:d||hoje(),l:l});save();render()}
function delLeite(i){D.leite.splice(i,1);save();render()}
function pBackup(){return '<div class="card"><h2 style="margin-top:0">Instalar no celular</h2><p class="mut">Android (Chrome): menu ⋮, depois Adicionar à tela inicial. iPhone (Safari): Compartilhar, depois Adicionar à Tela de Início.</p></div><div class="card"><h2 style="margin-top:0">Backup dos dados</h2><p class="mut">Seus dados ficam só neste navegador. Se limpar o histórico ou trocar de celular, eles somem. Copie o texto abaixo e guarde nas suas notas ou no WhatsApp.</p>'+
 '<textarea id="bk" rows="7">'+esc(JSON.stringify(D))+'</textarea><button class="btn" onclick="copiar()">Copiar backup</button> <button class="btn alt" onclick="restaurar()">Restaurar deste texto</button><div id="bmsg" class="mut"></div></div>'}
function copiar(){var t=document.getElementById('bk');t.select();try{document.execCommand('copy');document.getElementById('bmsg').textContent='Copiado.'}catch(e){document.getElementById('bmsg').textContent='Selecione o texto e copie manualmente.'}}
function restaurar(){try{var d=JSON.parse(document.getElementById('bk').value);if(!d.animais||!d.leite)throw 0;D=d;save();render()}catch(e){document.getElementById('bmsg').textContent='Texto inválido. Cole o backup completo.'}}
function render(){nav();var h=tab==='animais'?pAnimais():tab==='leite'?pLeite():pBackup();document.getElementById('app').innerHTML=h;if(tab==='animais')lista()}
render();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
